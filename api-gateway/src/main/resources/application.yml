server:
  port: 8082

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes: []

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway